<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои Напоминания</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #708499);
            --button-color: var(--tg-theme-button-color, #2c2842);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
        h1 { font-size: 22px; margin-bottom: 20px; text-align: center; }
        
        .form-container {
            background-color: var(--secondary-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input {
            width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px;
            border-radius: 8px; border: 1px solid var(--hint-color); 
            background-color: var(--bg-color); color: var(--text-color); font-size: 15px;
        }
        input::placeholder { color: var(--hint-color); }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background-color: var(--button-color); color: var(--button-text-color);
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:active { opacity: 0.8; }

        .reminder-item {
            background-color: var(--secondary-bg); padding: 16px;
            border-radius: 12px; margin-bottom: 12px;
        }
        .reminder-text { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .reminder-date { font-size: 13px; color: var(--hint-color); }
    </style>
</head>
<body>
    <h1>Добавить напоминание</h1>
    
    <div class="form-container">
        <input type="text" id="reminder-text" placeholder="Что нужно сделать?">
        <input type="number" id="reminder-time" placeholder="Через сколько минут?" min="1">
        <button onclick="sendReminder()">Сохранить в бота</button>
    </div>

    <h2 style="font-size: 18px; margin-top: 30px;">Ваши задачи</h2>
    <div id="reminders-list">
        <!-- Сюда мы потом научимся выводить реальные данные -->
        <p style="color: var(--hint-color); font-size: 14px;">(Здесь пока пусто, реальные данные появятся, когда мы перенесем бота на сервер)</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendReminder() {
            const text = document.getElementById('reminder-text').value;
            const time = document.getElementById('reminder-time').value;

            if (!text || !time) {
                tg.showAlert("Пожалуйста, заполни оба поля!");
                return;
            }

            // Отправляем данные боту
            const data = { action: "add_reminder", text: text, minutes: time };
            tg.sendData(JSON.stringify(data));
            
            // Закрываем окно приложения
            tg.close();
        }
    </script>
</body>
</html>
